server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}

spring:
  application:
    name: auth-app
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  config:
    import:
      - "optional:vault://"
      - "optional:configserver:"

  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}
      uri: ${VAULT_URI:http://localhost:8200}
      authentication: ${VAULT_AUTH_METHOD:TOKEN}
      token: ${VAULT_TOKEN:root}
      kv:
        enabled: true
        backend: secret
        default-context: auth-app
        profile-separator: "/"
        application-name: auth-app
      config:
        order: -15
    config:
      enabled: ${CONFIG_ENABLED:false}
      uri: ${CONFIG_SERVER_URI:http://localhost:8888}
      name: auth-app
      label: ${CONFIG_SERVER_LABEL:main}
      fail-fast: ${CONFIG_FAIL_FAST:false}
      retry:
        initial-interval: 1000
        max-attempts: 6
        max-interval: 2000
        multiplier: 1.1
eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    register-with-eureka: false
    fetch-registry: false
    registry-fetch-interval-seconds: 30
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    instance-id: ${spring.application.name}:${server.port}
    hostname: ${HOSTNAME:localhost}
    metadata-map:
      zone: primary
      version: ${project.version:1.0.0}


management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: "health,info,metrics"
  endpoint:
    health:
      show-details: when-authorized
