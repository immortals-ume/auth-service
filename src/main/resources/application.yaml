server:
  port: 8080
  address: localhost
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

spring:
  application:
    name: auth-app
  profiles:
    default: dev
    active: dev
  sql:
    init:
      mode: never
  liquibase:
    default-schema: public
    liquibase-schema: public
    change-log: db/changelog-master.xml
    enabled: false
    url: jdbc:postgresql://localhost:5432/user_db
    user: user
    password: admin
    driver-class-name: org.postgresql.Driver
  cloud:
    vault:
      uri: http://localhost:8200
      token: root
      kv:
        enabled: false
        backend: secret
        default-context: "kv/springboot-vault-docker"
  config:
    enabled: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
    enabled: false
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    metadata-map:
      zone: primary
    hostname: ${HOSTNAME:localhost}

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  auditevents:
    enabled: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  pattern:
    level: "%5p [traceId=%X{traceId},spanId=%X{spanId}]"
  level:
    com.immortals.authapp.security: DEBUG
    com.immortals.authapp.service: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.tool.schema.internal.SchemaCreatorImpl: TRACE
    org.springframework: INFO

auth:
  jwt-issuer: https://your-issuer.example.com
  access-token-expiry-ms: 900000
  refresh-token-expiry-ms: 604800000
  cache:
    static-resources:
      max-age-seconds: 31536000
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "https://yourdomain.com"
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
      - "PATCH"
      - "DELETE"
      - "OPTIONS"
    allowed-headers:
      - "*"
    allow-credentials: true
    max-age: 31536000


datasource:
  write:
    url: jdbc:postgresql://localhost:5432/user_db
    username: user
    password: admin
    driver-class-name: org.postgresql.Driver
  read:
    url: jdbc:postgresql://localhost:5432/user_db
    username: replicator
    password: test
    driver-class-name: org.postgresql.Driver
  core:
    show-sql: true
    generate-ddl: true
    hibernate:
      ddl-auto: update
      dialect: org.hibernate.dialect.PostgreSQLDialect
      format-sql: true
      envers:
        audit-table-suffix: _AUD
        revision-field-name: rev
        revision-type-field-name: rev_type
        store-data-at-delete: true
        default-schema: user_audit


