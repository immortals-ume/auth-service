spring:
  devtools:
    restart:
      enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: false
  config:
    import:
      - "vault://"
      - "configserver:"

  cloud:
    vault:
      authentication: APPROLE
      token: ""
      app-role:
        role-id: ${VAULT_ROLE_ID}
        secret-id: ${VAULT_SECRET_ID}
        role: auth-service
        app-role-path: approle
    config:
      fail-fast: true
      retry:
        max-attempts: 10
        initial-interval: 2000
        max-interval: 5000

server:
  address: 0.0.0.0
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    enabled: true
    sampling:
      probability: 0.1

auth:
  kafka:
    topics:
      email-verification: auth.notification.email-verification
      password-reset: auth.notification.password-reset
      otp: auth.notification.otp
    partitions: 3
    replication-factor: 3

datasource:
  write:
    pool-name: write-pool-prod
    maximum-pool-size: 20
    minimum-idle: 5
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000
  read:
    pool-name: read-pool-prod
    maximum-pool-size: 30
    minimum-idle: 10
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000

logging:
  level:
    com.immortals.auth.service: INFO
    org.hibernate.SQL: WARN
    org.springframework: WARN
    org.springframework.cloud.vault: INFO
    org.springframework.cloud.config: INFO
